<style>/* ═══════════════════════════════════════════════════════════
   NEXT VISION — DESIGN SYSTEM ENTRY POINT
   Consumers link this single file. It is an index of @imports only.
═══════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════
   NEXT VISION — WEBFONTS
   Syne (display) + Plus Jakarta Sans (body/UI), self-hosted.
   Both are variable fonts — full weight axes available.
═══════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════
   NEXT VISION — COLOR TOKENS
   A warm, editorial palette: near-black "ink", cream paper,
   with RED as the primary brand mark and GOLD as the signal.

   GOLD RULE (from the brand): Gold = payoff, data, signal.
   One gold accent per visual section. Never two gold elements
   side by side. Never gold on structural/filler words.
   Gold lives on: numbers, payoff words, clickable signals,
   accent marks, section dividers.
═══════════════════════════════════════════════════════════ */

:root {
  /* ── Brand: Red (primary) ── */
  --red:      #C0392B;   /* primary brand red — CTAs, marks, accents */
  --red-lt:   #E04535;   /* hover / brighter red */
  --red-dk:   #8B1A1A;   /* deep red — icon wells, gradients */

  /* ── Brand: Gold (signal / payoff) ── */
  --gold:     #C8922A;   /* the signal color — data, payoff, clickable */
  --gold-lt:  #E8B84B;   /* brighter gold highlight */

  /* ── Ink (warm near-blacks) ── */
  --ink:      #0C0B09;   /* page-dark background, primary text on light */
  --ink2:     #1A1814;   /* raised dark surface (cards, dropdowns) */
  --ink3:     #252220;   /* highest dark surface (marquee, wells) */

  /* ── Paper (warm neutrals) ── */
  --cream:    #F2EDE5;   /* default light page background */
  --sand:     #D8D0C4;   /* hairline borders, dividers on light */
  --fog:      #6B6560;   /* muted body text on light */
  --white:    #FFFFFF;

  /* ─────────────────────────────────────────────
     SEMANTIC ALIASES
     Prefer these in components over raw scale values.
  ───────────────────────────────────────────── */

  /* Surfaces */
  --surface-page:        var(--cream);
  --surface-page-dark:   var(--ink);
  --surface-card:        var(--white);
  --surface-card-dark:   var(--ink2);
  --surface-raised-dark: var(--ink3);

  /* Text — on light */
  --text-strong:   var(--ink);
  --text-body:     var(--fog);
  --text-accent:   var(--red);
  --text-signal:   var(--gold);

  /* Text — on dark */
  --text-on-dark:        var(--white);
  --text-on-dark-muted:  rgba(255, 255, 255, .42);
  --text-on-dark-faint:  rgba(255, 255, 255, .28);

  /* Borders / hairlines */
  --border-light:     var(--sand);
  --border-dark:      rgba(192, 57, 43, .15);   /* red-tinted hairline on dark */
  --border-on-dark:   rgba(255, 255, 255, .08);
  --border-gold:      rgba(200, 146, 42, .22);

  /* Interaction */
  --action:          var(--red);
  --action-hover:    var(--red-lt);
  --focus-ring:      rgba(200, 146, 42, .45);
}

/* ═══════════════════════════════════════════════════════════
   NEXT VISION — TYPOGRAPHY TOKENS
   Display: Syne (800/700) — geometric, confident, tight tracking.
   Body/UI: Plus Jakarta Sans (300 body, 500/600 UI labels).

   Rules of the house:
   • Headlines are Syne, weight 800, line-height ~.92–1.0,
     letter-spacing -.02em. Often UPPERCASE for labels.
   • Body copy is Plus Jakarta Sans, weight 300, line-height 1.7–1.8.
   • Micro-labels (eyebrows / section labels) are 10–11px, weight
     600–700, letter-spacing .2em, UPPERCASE.
═══════════════════════════════════════════════════════════ */

:root {
  /* Families */
  --font-display: 'Syne', sans-serif;
  --font-body:    'Plus Jakarta Sans', sans-serif;

  /* Weights */
  --fw-light:     300; /* @kind font */
  --fw-regular:   400; /* @kind font */
  --fw-medium:    500; /* @kind font */
  --fw-semibold:  600; /* @kind font */
  --fw-bold:      700; /* @kind font */
  --fw-extrabold: 800; /* @kind font */

  /* Display / heading scale (Syne) — fluid where it matters */
  --fs-hero:      clamp(52px, 9vw, 110px); /* @kind font */ /* homepage hero */
  --fs-page:      clamp(42px, 7vw, 82px);  /* @kind font */ /* page titles */
  --fs-display:   clamp(32px, 5vw, 52px);  /* @kind font */ /* section titles */
  --fs-h2:        32px; /* @kind font */
  --fs-h3:        20px; /* @kind font */
  --fs-h4:        16px; /* @kind font */

  /* Body scale (Plus Jakarta Sans) */
  --fs-lead:      18px; /* @kind font */ /* hero / intro body */
  --fs-body:      17px; /* @kind font */ /* default reading size */
  --fs-body-sm:   14px; /* @kind font */ /* dense body, card copy */
  --fs-meta:      13px; /* @kind font */ /* captions, meta */
  --fs-label:     11px; /* @kind font */ /* eyebrows, nav, button text */
  --fs-micro:     10px; /* @kind font */ /* section labels, stat labels */

  /* Line heights */
  --lh-tight:     .92;  /* @kind font */ /* hero display */
  --lh-snug:      1.0;  /* @kind font */ /* section titles */
  --lh-heading:   1.15; /* @kind font */
  --lh-body:      1.7;  /* @kind font */
  --lh-relaxed:   1.8;  /* @kind font */ /* long-form body */

  /* Letter spacing */
  --ls-display:   -.02em; /* @kind font */ /* tight on big Syne */
  --ls-label:     .1em;   /* @kind font */ /* button / nav labels */
  --ls-eyebrow:   .2em;   /* @kind font */ /* eyebrows */
  --ls-section:   .22em;  /* @kind font */ /* section labels (widest) */
}

/* ═══════════════════════════════════════════════════════════
   NEXT VISION — SPACING, RADII, SHADOWS, MOTION
═══════════════════════════════════════════════════════════ */

:root {
  /* ── Spacing scale (4px base) ── */
  --space-1:   4px;
  --space-2:   8px;
  --space-3:   12px;
  --space-4:   16px;
  --space-5:   20px;
  --space-6:   24px;
  --space-8:   32px;
  --space-10:  40px;
  --space-12:  48px;
  --space-16:  64px;
  --space-20:  80px;
  --space-24:  96px;   /* default section padding (vertical) */

  /* Layout */
  --container:      1160px;  /* max content width */
  --gutter:         2.5rem;  /* page horizontal padding */
  --gutter-mobile:  1.5rem;
  --nav-height:     64px;

  /* ── Radii ── */
  --radius:      6px;    /* the brand default — buttons, inputs */
  --radius-sm:   4px;    /* tags, small chips */
  --radius-md:   10px;   /* stat cards */
  --radius-lg:   12px;   /* content cards */
  --radius-xl:   16px;   /* modals */
  --radius-pill: 100px;  /* back buttons, slide CTAs */

  /* ── Shadows ── */
  --shadow-card:    0 16px 40px rgba(0, 0, 0, .10);   /* card hover lift (light) */
  --shadow-drop:    0 20px 48px rgba(0, 0, 0, .55);   /* dropdowns / dark overlays */
  --shadow-modal:   0 16px 48px rgba(0, 0, 0, .40);
  --shadow-red:     0 8px 20px rgba(192, 57, 43, .30); /* red button hover glow */

  /* ── Borders ── */
  --hairline:       1px;
  --rule-accent:    2px;   /* red underline accents */

  /* ── Motion ── */
  --ease-out:   cubic-bezier(.16, 1, .3, 1);  /* @kind other */ /* signature expressive ease */
  --ease-std:   ease;  /* @kind other */
  --dur-fast:   .15s;  /* @kind other */
  --dur-base:   .25s;  /* @kind other */
  --dur-slow:   .3s;   /* @kind other */

  /* ── Signature textures (use as background) ── */
  /* Diagonal red pinstripe — used on dark heroes */
  --texture-pinstripe:
    repeating-linear-gradient(-50deg, transparent, transparent 40px,
      rgba(192, 57, 43, .022) 40px, rgba(192, 57, 43, .022) 80px); /* @kind other */
  /* Red→gold→red accent rule — the brand's signature divider line */
  --rule-hero:
    linear-gradient(90deg, var(--red-dk), var(--red),
      rgba(200, 146, 42, .4), var(--red), var(--red-dk));
}

</style>
<style>/* ═══ NEXT VISION — WEBSITE UI KIT STYLES (built on the design tokens) ═══ */
html { scroll-behavior: smooth; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-body); background: var(--cream); color: var(--ink); overflow-x: hidden; }
.nv-app { min-height: 100vh; }

/* ── NAV ── */
.nv-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; height: 64px;
  background: rgba(12,11,9,.96); backdrop-filter: blur(14px);
  display: flex; align-items: center; justify-content: space-between; padding: 0 2.5rem;
  border-bottom: 1px solid rgba(192,57,43,.18); }
.nv-logo { font-family: var(--font-display); font-weight: 800; font-size: 18px; color: #fff;
  letter-spacing: .04em; cursor: pointer; transition: opacity .2s; }
.nv-logo:hover { opacity: .75; }
.nv-logo span { color: var(--red); }
.nv-links { display: flex; list-style: none; align-items: center; }
.nv-links > li > a { display: block; padding: 0 1rem; height: 64px; line-height: 64px;
  font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: rgba(255,255,255,.45); cursor: pointer; transition: color .2s; }
.nv-links > li > a:hover, .nv-links > li.active > a { color: #fff; }
.nv-links > li > a::after { content: ''; display: block; height: 1.5px; background: var(--gold);
  transform: scaleX(0); transform-origin: left; transition: transform .25s; margin-top: -1.5px; }
.nv-links > li > a:hover::after, .nv-links > li.active > a::after { transform: scaleX(1); }
.nv-cta { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: #fff; background: var(--red); padding: 9px 22px;
  border-radius: var(--radius); cursor: pointer; border: none; margin-left: 1rem; transition: all .2s; }
.nv-cta:hover { background: var(--red-lt); transform: translateY(-1px); }
@media (max-width: 860px) { .nv-links { display: none; } .nv-nav { padding: 0 1.5rem; } }

/* ── HERO ── */
.nv-hero { min-height: 100vh; background: var(--ink); display: flex; flex-direction: column;
  justify-content: center; padding: 120px 2.5rem 100px; position: relative; overflow: hidden; }
.nv-hero::before { content: ''; position: absolute; inset: 0; background: var(--texture-pinstripe); }
.nv-hero::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
  background: var(--rule-hero); }
.nv-eyebrow { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 28px; position: relative; }
.nv-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold);
  box-shadow: 0 0 8px rgba(200,146,42,.4); animation: nvPulse 2s ease-in-out infinite; }
@keyframes nvPulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .55; transform: scale(.8); } }
.nv-eyebrow-txt { font-size: 11px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase;
  color: rgba(255,255,255,.4); }
.nv-hero-h { font-family: var(--font-display); font-weight: 800; font-size: clamp(52px,9vw,110px);
  line-height: .92; letter-spacing: -.02em; color: #fff; max-width: 900px; margin-bottom: 32px; position: relative; }
.nv-hero-h em { font-style: normal; color: var(--red); }
.nv-outline { font-style: normal; -webkit-text-stroke: 2px rgba(200,146,42,.55); color: transparent; }
.nv-hero-body { font-size: 18px; font-weight: 300; line-height: 1.7; color: rgba(255,255,255,.42);
  max-width: 520px; margin-bottom: 40px; position: relative; }
.nv-hero-cta { display: flex; gap: 14px; flex-wrap: wrap; position: relative; }
.nv-scroll { position: absolute; bottom: 32px; right: 2.5rem; display: flex; flex-direction: column;
  align-items: center; gap: 8px; color: rgba(255,255,255,.2); font-size: 10px; letter-spacing: .15em; text-transform: uppercase; }
.nv-scroll-line { width: 1px; height: 40px; background: linear-gradient(to bottom, rgba(192,57,43,.5), transparent);
  animation: nvScroll 1.8s ease-in-out infinite; }
@keyframes nvScroll { 0% { transform: scaleY(0); transform-origin: top; } 50% { transform: scaleY(1); transform-origin: top; }
  51% { transform: scaleY(1); transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }

/* ── BUTTONS ── */
.nv-btn-red, .nv-btn-ghost { display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; padding: 14px 30px; border-radius: var(--radius); cursor: pointer;
  border: 1px solid transparent; transition: all .25s; }
.nv-btn-red { background: var(--red); color: #fff; }
.nv-btn-red:hover { background: var(--red-lt); transform: translateY(-2px); box-shadow: var(--shadow-red); }
.nv-btn-ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.18); }
.nv-btn-ghost:hover { background: rgba(255,255,255,.06); border-color: rgba(200,146,42,.4); }

/* ── MARQUEE ── */
.nv-marquee { background: var(--ink3); padding: 13px 0; overflow: hidden; white-space: nowrap;
  border-top: 1px solid rgba(192,57,43,.12); border-bottom: 1px solid rgba(192,57,43,.12); }
.nv-marquee-track { display: inline-flex; animation: nvMq 26s linear infinite; }
@keyframes nvMq { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.nv-marquee-item { display: inline-flex; align-items: center; gap: 24px; padding: 0 24px;
  font-family: var(--font-display); font-size: 11px; font-weight: 700; letter-spacing: .16em;
  text-transform: uppercase; color: rgba(255,255,255,.32); }
.nv-marquee-sep { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); opacity: .4; }

/* ── SHARED LABELS ── */
.nv-section-label { font-size: 10px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase;
  color: var(--red); margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
.nv-section-label::after { content: ''; width: 48px; height: 1px;
  background: linear-gradient(90deg, rgba(200,146,42,.45), transparent); }
.nv-section-label.light { color: rgba(255,255,255,.4); }
.nv-section-label.light::after { background: rgba(255,255,255,.1); }

/* ── ABOUT ── */
.nv-about-grid { max-width: 1160px; margin: 0 auto; padding: 96px 2.5rem;
  display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: start; }
@media (max-width: 820px) { .nv-about-grid { grid-template-columns: 1fr; gap: 48px; } }
.nv-about-title { font-family: var(--font-display); font-weight: 800; font-size: clamp(32px,5vw,48px);
  line-height: 1; letter-spacing: -.02em; color: var(--ink); margin-bottom: 22px; }
.nv-about-body { font-size: 17px; font-weight: 300; line-height: 1.8; color: var(--fog); margin-bottom: 28px; }

/* Vision ring */
.nv-ring { width: 100%; max-width: 360px; aspect-ratio: 1; border-radius: 50%;
  border: 2px solid rgba(192,57,43,.18); display: flex; align-items: center; justify-content: center;
  position: relative; margin: 0 auto 32px; }
.nv-ring::before { content: ''; position: absolute; inset: 16px; border-radius: 50%; border: 1px dashed rgba(192,57,43,.15); }
.nv-ring::after { content: ''; position: absolute; inset: -18px; border-radius: 50%; border: 1px solid rgba(192,57,43,.06); }
.nv-ring-inner { width: 60%; height: 60%; border-radius: 50%; background: var(--ink2);
  display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px;
  border: 1px solid rgba(192,57,43,.18); }
.nv-ring-label { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: .18em;
  text-transform: uppercase; color: var(--red); text-align: center; line-height: 1.4; }
.nv-ring-sub { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: rgba(200,146,42,.6); font-weight: 500; }

/* Stats */
.nv-stat-row { display: flex; gap: 12px; }
.nv-stat { background: var(--ink); border: 1px solid rgba(192,57,43,.15); border-radius: 10px;
  padding: 20px 16px; text-align: center; flex: 1; min-width: 0; }
.nv-stat-num { font-family: var(--font-display); font-size: 30px; font-weight: 800; color: var(--gold); line-height: 1; margin-bottom: 6px; }
.nv-stat-lbl { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.3); }

/* Pillars */
.nv-pillars { display: flex; flex-direction: column; gap: 20px; }
.nv-pillar { display: flex; align-items: flex-start; gap: 16px; }
.nv-pillar-icon { width: 44px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 2px; background: var(--red-dk); border: 1px solid rgba(192,57,43,.3); color: rgba(255,200,190,.85); }
.nv-pillar-icon.gold { background: var(--ink); border-color: rgba(200,146,42,.22); color: var(--gold); }
.nv-pillar-title { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 3px; }
.nv-pillar-desc { font-size: 14px; font-weight: 300; color: var(--fog); line-height: 1.6; }

/* ── SERVICES ── */
.nv-services { background: var(--ink); padding: 96px 2.5rem; position: relative; overflow: hidden; }
.nv-services::before { content: ''; position: absolute; inset: 0; background: var(--texture-pinstripe); }
.nv-services-inner { max-width: 1160px; margin: 0 auto; position: relative; }
.nv-services-h { font-family: var(--font-display); font-weight: 800; font-size: clamp(30px,4.5vw,46px);
  line-height: 1.02; letter-spacing: -.02em; color: #fff; margin-bottom: 40px; }
.nv-services-h em { font-style: normal; color: var(--gold); }
.nv-svc-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 2px; }
@media (max-width: 900px) { .nv-svc-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 580px) { .nv-svc-grid { grid-template-columns: 1fr; } }
.nv-svc { background: rgba(255,255,255,.025); border: 1px solid rgba(192,57,43,.07); padding: 40px 32px;
  position: relative; overflow: hidden; cursor: pointer; transition: background .3s; }
.nv-svc:hover { background: rgba(192,57,43,.05); }
.nv-svc-arrow { position: absolute; top: 18px; right: 20px; font-size: 16px; color: var(--gold); opacity: 0;
  transform: translate(-4px,4px); transition: opacity .2s, transform .2s; }
.nv-svc:hover .nv-svc-arrow { opacity: .7; transform: translate(0,0); }
.nv-svc-num { font-family: var(--font-display); font-size: 11px; font-weight: 700; letter-spacing: .2em;
  color: rgba(255,255,255,.1); margin-bottom: 24px; transition: color .3s; }
.nv-svc:hover .nv-svc-num { color: var(--gold); }
.nv-svc-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 12px; }
.nv-svc-desc { font-size: 14px; font-weight: 300; color: rgba(255,255,255,.42); line-height: 1.65; }
.nv-svc-rule { position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: var(--red);
  transform: scaleX(0); transform-origin: left; transition: transform .3s var(--ease-out); }
.nv-svc:hover .nv-svc-rule { transform: scaleX(1); }

/* portfolio CTA banner under services */
.nv-svc-portfolio { display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap;
  margin-top: 2px; padding: 28px 32px; background: linear-gradient(100deg, rgba(192,57,43,.14), rgba(200,146,42,.08));
  border: 1px solid rgba(200,146,42,.22); border-radius: var(--radius-lg); text-decoration: none; transition: border-color .25s, transform .25s; }
.nv-svc-portfolio:hover { border-color: rgba(200,146,42,.5); transform: translateY(-2px); }
.nv-svc-portfolio-txt { display: flex; flex-direction: column; gap: 3px; }
.nv-svc-portfolio-txt .lbl { font-size: 10px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.nv-svc-portfolio-txt strong { font-family: var(--font-display); font-weight: 800; font-size: clamp(20px,2.6vw,26px); color: #fff; letter-spacing: -.01em; }
.nv-svc-portfolio-txt .sub { font-size: 14px; font-weight: 300; color: rgba(255,255,255,.5); margin-top: 2px; }
.nv-svc-portfolio-cta { flex-shrink: 0; display: inline-flex; align-items: center; gap: 9px; font-family: var(--font-display);
  font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #fff; background: var(--red);
  padding: 14px 26px; border-radius: var(--radius); transition: all .25s; }
.nv-svc-portfolio:hover .nv-svc-portfolio-cta { background: var(--red-lt); }
.nv-svc-portfolio-cta svg { transition: transform .25s; }
.nv-svc-portfolio:hover .nv-svc-portfolio-cta svg { transform: translateX(4px); }

/* ── PARTNERS ── */
.nv-partners { background: var(--cream); }
.nv-partners-inner { max-width: 1160px; margin: 0 auto; padding: 88px 2.5rem; }
.nv-partner-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: 2px;
  border: 1px solid var(--sand); border-radius: var(--radius-lg); overflow: hidden; }
.nv-partner { background: var(--white); padding: 28px 26px; }

<!-- content store + GitHub publishing engine + image downscaler -->
<script>
/* ════════════════════════════════════════════════════════════════════
   Next Vision — content store + GitHub publishing engine
   --------------------------------------------------------------------
   • data.js holds the COMMITTED content (window.NV_DATA) — the source of
     truth that ships in the repo and is what visitors see.
   • The admin edits a DRAFT layer kept in localStorage (this browser only).
     Drafts render live but never touch the repo until you Publish.
   • Publish = regenerate data.js and either download it (commit by hand) or
     PUT it to GitHub via the Contents API using a personal access token.
   ════════════════════════════════════════════════════════════════════ */
window.NVStore = (function () {
  var DRAFT = "nv_site_draft_v1";   // edited content (overrides data.js)
  var AUTH = "nv_admin_hash_v1";    // sha-256 of the admin passphrase
  var GH = "nv_github_cfg_v1";      // {owner,repo,branch,path,message}
  var subs = [];

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function base() { return clone(window.NV_DATA); }

  function load() {
    try { var s = localStorage.getItem(DRAFT); return s ? JSON.parse(s) : base(); }
    catch (e) { return base(); }
  }

  /* Backfill fields added after a draft was first saved, so an older draft in
     this browser never crashes the newer UI. Safe to run every load. */
  function normalize(d) {
    try {
      if (d.hero && d.hero.image === undefined) d.hero.image = "";
      (d.partners || []).forEach(function (p) { if (p.logo === undefined) p.logo = ""; });
      (d.divisions || []).forEach(function (x) {
        if (!x.linkType) x.linkType = (x.href && /^(https?:|\.\.?\/|.*\.html)/.test(x.href)) ? "external" : "internal";
        if (x.href === undefined) x.href = "";
        if (!x.page || typeof x.page !== "object") x.page = {};
        var p = x.page;
        if (p.eyebrow === undefined) p.eyebrow = "";
        if (p.title === undefined) p.title = "";
        if (p.intro === undefined) p.intro = "";
        if (p.heroImage === undefined) p.heroImage = "";
        if (!Array.isArray(p.sections)) p.sections = [];
        if (!Array.isArray(p.gallery)) p.gallery = [];
        if (p.ctaLabel === undefined) p.ctaLabel = "Start a Project";
      });
    } catch (e) {}
    return d;
  }
  var data = normalize(load());

  /* ── Baked-data sync (per-publish signature) ──
     The published file is authoritative. We stamp a fingerprint of the baked
     content; if this browser last saw a DIFFERENT publish and is holding a
     stale draft (and the owner isn't mid-edit), we re-seed from the fresh
     bake so every browser converges on the latest content. */
  var SIG = "nv_site_baked_sig_v1";
  var ADMIN_SESSION = "nv_admin_session";
  function bakedSignature(d) {
    var s = JSON.stringify(d || {});
    var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
    return s.length + ":" + h.toString(16);
  }
  (function syncBakedData() {
    try {
      var current = bakedSignature(base());
      var cached = localStorage.getItem(SIG);
      var isAdmin = sessionStorage.getItem(ADMIN_SESSION) === "1";
      var hasDraftNow = !!localStorage.getItem(DRAFT);
      if (!hasDraftNow) {
        localStorage.setItem(SIG, current);
      } else if (cached !== current && !isAdmin) {
        // A newer publish than this browser last saw: refresh to it.
        localStorage.removeItem(DRAFT);
        data = normalize(base());
        localStorage.setItem(SIG, current);
      } else if (cached !== current && isAdmin) {
        // Owner is mid-edit — never clobber work; just update the baseline.
        localStorage.setItem(SIG, current);
      }
    } catch (e) {}
  })();

  function emit() { subs.forEach(function (f) { try { f(); } catch (e) {} }); }
  function persist() {
    try {
      localStorage.setItem(DRAFT, JSON.stringify(data));
      window.__nvSaveError = null;
    } catch (e) {
      // Most likely the browser storage quota (huge embedded image). Keep the
      // edit in memory and flag it so the admin can warn instead of failing silently.
      window.__nvSaveError = "storage-full";
    }
    emit();
  }

  /* deep-set by path string e.g. "hero.line2" */
  function setPath(obj, path, val) {
    var k = path.split("."), o = obj;
    for (var i = 0; i < k.length - 1; i++) o = o[k[i]];
    o[k[k.length - 1]] = val;
  }

  return {
    /* ── content ── */
    get: function () { return data; },
    set: function (path, val) { setPath(data, path, val); persist(); },
    update: function (fn) { fn(data); persist(); },
    hasDraft: function () { try { return !!localStorage.getItem(DRAFT); } catch (e) { return false; } },
    discardDraft: function () { try { localStorage.removeItem(DRAFT); } catch (e) {} data = base(); emit(); },
    subscribe: function (f) { subs.push(f); return function () { var i = subs.indexOf(f); if (i > -1) subs.splice(i, 1); }; },
    uid: function (p) { return (p || "x") + Math.random().toString(36).slice(2, 7); },

    /* ── serialize → a valid data.js the repo can ship ── */
    exportDataJS: function () {
      var icons = window.NV_ICONS || {};
      return "/* Next Vision — site content. Generated by the admin. */\n" +
        "window.NV_DATA = " + JSON.stringify(data, null, 2) + ";\n\n" +
        "/* Stroke icons (24×24), Lucide/Feather style */\n" +
        "window.NV_ICONS = " + JSON.stringify(icons, null, 2) + ";\n";
    },

    /* ── single-file publishing (the site bakes its content between sentinels) ──
       dataBlock() = exactly what lives between the BAKED:DATA markers.
       bakeInto(html) = a fresh copy of index.html with the content swapped in. */
    dataBlock: function () {
      var icons = window.NV_ICONS || {};
      return "\nwindow.NV_DATA = " + JSON.stringify(data, null, 2) + ";\n\n" +
        "window.NV_ICONS = " + JSON.stringify(icons, null, 2) + ";\n";
    },
    bakeInto: function (htmlSource) {
      var s = "/* BAKED:DATA" + ":START */", e = "/* BAKED:DATA" + ":END */";
      var i = htmlSource.indexOf(s), j = htmlSource.indexOf(e);
      if (i === -1 || j === -1 || j < i) throw new Error("Couldn't find the content markers in index.html — make sure you're publishing the rebuilt single-file site.");
      return htmlSource.slice(0, i + s.length) + this.dataBlock() + htmlSource.slice(j);
    },
    /* Call after a CONFIRMED deploy (e.g. successful GitHub push): the live
       bake now equals this content, so the local draft is no longer
       "unpublished". Keeps the in-memory data as-is. */
    markPublished: function () {
      try {
        localStorage.removeItem(DRAFT);
        localStorage.setItem(SIG, bakedSignature(data));
      } catch (e) {}
      emit();
    },
    adminSessionStart: function () { try { sessionStorage.setItem(ADMIN_SESSION, "1"); } catch (e) {} },

    /* ── admin auth (client-side gate; real write-protection is the GH token) ── */
    isEnrolled: function () { try { return !!localStorage.getItem(AUTH); } catch (e) { return false; } },
    enroll: function (hash) { try { localStorage.setItem(AUTH, hash); } catch (e) {} },
    checkHash: function (hash) { try { return localStorage.getItem(AUTH) === hash; } catch (e) { return false; } },
    resetAuth: function () { try { localStorage.removeItem(AUTH); } catch (e) {} },

    /* ── github config (token is NEVER stored here / never committed) ── */
    ghConfig: function () {
      try { return JSON.parse(localStorage.getItem(GH)) || {}; } catch (e) { return {}; }
    },
    setGhConfig: function (cfg) { try { localStorage.setItem(GH, JSON.stringify(cfg)); } catch (e) {} },
  };
})();

/* SHA-256 hex (secure contexts: https / localhost). Falls back to a weak
   non-crypto hash on bare file:// where SubtleCrypto is unavailable. */
window.nvHash = async function (str) {
  try {
    var buf = new TextEncoder().encode(str);
    var h = await crypto.subtle.digest("SHA-256", buf);
    return [].map.call(new Uint8Array(h), function (x) { return x.toString(16).padStart(2, "0"); }).join("");
  } catch (e) {
    var h2 = 5381; for (var i = 0; i < str.length; i++) h2 = ((h2 << 5) + h2 + str.charCodeAt(i)) >>> 0;
    return "weak:" + h2.toString(16);
  }
};

/* ── GitHub Contents API publisher ──
   Works from any https page (GitHub's API sends CORS headers). Needs a
   fine-grained PAT with Contents: Read & Write on the target repo. */
window.NVPublish = (function () {
  function b64(str) { return btoa(unescape(encodeURIComponent(str))); }
  var API = "https://api.github.com";

  async function getSha(cfg, token) {
    var url = API + "/repos/" + cfg.owner + "/" + cfg.repo + "/contents/" +
      encodeURIComponent(cfg.path).replace(/%2F/g, "/") + "?ref=" + encodeURIComponent(cfg.branch || "main");
    var r = await fetch(url, { headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" } });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error("Lookup failed (" + r.status + "). Check repo, path, branch & token scope.");
    var j = await r.json();
    return j.sha;
  }

  return {
    async push(cfg, token, content) {
      if (!cfg.owner || !cfg.repo || !cfg.path) throw new Error("Set owner, repo and file path first.");
      if (!token) throw new Error("A GitHub personal-access token is required.");
      var sha = await getSha(cfg, token);
      var url = API + "/repos/" + cfg.owner + "/" + cfg.repo + "/contents/" +
        encodeURIComponent(cfg.path).replace(/%2F/g, "/");
      var body = {
        message: cfg.message || "Update site content via Next Vision admin",
        content: b64(content),
        branch: cfg.branch || "main",
      };
      if (sha) body.sha = sha;
      var r = await fetch(url, {
        method: "PUT",
        headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!r.ok) {
        var t = await r.text();
        throw new Error("Publish failed (" + r.status + "). " + t.slice(0, 160));
      }
      var j = await r.json();
      return { commit: j.commit && j.commit.html_url, sha: j.content && j.content.sha };
    },
  };
})();

/* ── Image downscaler ──
   Logos/photos uploaded in the admin get scaled to a sane size BEFORE they're
   stored, so a saved draft stays small enough to persist (and the published
   data.js stays light). Falls back to the original on any error. */
window.nvDownscale = function (file, maxDim, cb) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      try {
        var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var nw = Math.max(1, Math.round(w * scale)), nh = Math.max(1, Math.round(h * scale));
        var c = document.createElement("canvas"); c.width = nw; c.height = nh;
        c.getContext("2d").drawImage(img, 0, 0, nw, nh);
        var isPng = /image\/png/i.test(file.type);
        cb(c.toDataURL(isPng ? "image/png" : "image/jpeg", 0.85));
      } catch (e) { cb(reader.result); }
    };
    img.onerror = function () { cb(reader.result); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
};
</script>
